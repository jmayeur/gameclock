[package]
name = "gameclockd"
description = "Game clock daemon: owns time, input, the render loop, and the panel driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# docs/adr/0009: `hzeller` builds the C++ LED driver in and drives the real
# panel. Only the Pi release build (scripts/build-pi.sh) enables it.
[features]
hzeller = ["dep:rgbmatrix-sys", "rgbmatrix-sys/link"]
# Draws frames in the terminal on a dev machine. Not with `hzeller`.
simulator = []

[dependencies]
gameclock-core.workspace = true
rgbmatrix-sys = { workspace = true, optional = true }
signal-hook.workspace = true
# The system time zone and the zone files in /usr/share/zoneinfo (docs/adr/0013).
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo"] }

[lints]
workspace = true
