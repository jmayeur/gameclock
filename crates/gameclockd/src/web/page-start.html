<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Clock</title>
<style>
:root { color-scheme: light dark; --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #52525b; --line: #d4d4d8; --accent: #15803d; --danger: #b91c1c; }
@media (prefers-color-scheme: dark) { :root { --bg: #18181b; --card: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --accent: #22c55e; --danger: #f87171; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
main { max-width: 32rem; margin: 0 auto; padding: 16px; }
h1 { margin: 0 0 4px; font-size: 1.5rem; }
h2 { margin: 20px 0 8px; font-size: 1rem; color: var(--muted); }
form { margin: 0; }
label { display: block; color: var(--muted); }
input[type=text] { width: 100%; padding: 10px; margin: 4px 0 8px; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
select, input[type=color] { font: inherit; vertical-align: middle; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { display: inline-block; }
button { padding: 10px 14px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.alert { border-color: var(--danger); }
.status { color: var(--muted); margin: 0 0 12px; }
.reply { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
.reply.ok { border-color: var(--accent); }
.reply.error { border-color: var(--danger); }
</style>
</head>
<body>
<main>
<h1>Game Clock</h1>
