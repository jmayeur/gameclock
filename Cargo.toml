[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# GPL-2.0-or-later so we can link hzeller's GPL-2.0-only matrix driver.
# See docs/adr/0003-license-gpl-2.0-or-later.md before changing.
license = "GPL-2.0-or-later"
repository = "https://github.com/jmayeur/gameclock"
publish = false

# One place for dependency versions. Member crates use `{ workspace = true }`.
# Every dependency must satisfy deny.toml's GPL-2-compatible license policy.
[workspace.dependencies]
gameclock-core = { path = "crates/gameclock-core" }
embedded-graphics = "0.8.2"
rgbmatrix-sys = { path = "crates/rgbmatrix-sys" }
# Build-time only: compiles the vendored C++ driver (docs/adr/0009).
cc = "1.11.1"
# Blocking, thread-free signal waits for gameclockd (docs/adr/0010).
signal-hook = "0.4.6"
# Time and time zones (docs/adr/0013). Each crate adds the features it needs.
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
# Test only: counts heap allocations (docs/adr/0012).
allocation-counter = "0.8.1"

[workspace.lints.rust]
unsafe_code = "deny" # FFI crates opt out explicitly, with an ADR.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
# The target is a single-core ARMv6 Pi Zero W: favour runtime speed and size.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
