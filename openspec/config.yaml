schema: spec-driven

# Constraints an agent cannot infer from the code. CLAUDE.md is the full
# working agreement; this keeps OpenSpec artifacts consistent with it.
context: |
  Target device: Raspberry Pi Zero W, single-core ARMv6, 512 MB RAM. hzeller's
  LED driver refreshes the 64x32 panel from its own thread on that same core,
  so app CPU becomes visible flicker. Performance is the primary goal: runtime
  claims need on-device measurements (CPU %, refresh Hz, RSS), not reasoning.

  Architecture invariants (docs/adr/0005, 0006): gameclock-core is pure (no
  hardware, I/O, threads, or wall clock; time and input are injected). It
  renders into a Frame (embedded-graphics DrawTarget). A Panel only blits frames.
  The daemon renders on change and sleeps otherwise; no per-frame heap
  allocation on the hot path. unsafe is allowed only in the driver FFI crate.

  License is GPL-2.0-or-later (docs/adr/0003). New dependencies must be
  GPL-2.0-compatible and pass deny.toml: no Apache-2.0-only and no
  GPL-3.0/AGPL/LGPL-3.0 crates.

  This is not a port. docs/design/legacy-behavior.md describes the old clock as
  reference input; each behavior is re-decided in its proposal, not copied.

rules:
  proposal:
    - List the existing ADRs the change relies on.
    - If the change adds/removes/swaps a dependency, introduces or moves a boundary (crate, trait, process, protocol), assumes something about hardware or deployment, touches licensing, or reverses a prior decision, name the new ADR it requires.
    - For changes that affect runtime behavior on the Pi, state the expected CPU/memory impact and how it will be measured.
    - State what is out of scope.
  specs:
    - Scenarios must be concrete and testable on the host with injected time and input, unless explicitly marked as on-device scenarios.
  design:
    - Link ADRs for rationale instead of restating it.
    - A design.md is not a substitute for an ADR; architectural decisions also get an ADR in docs/adr/.
  tasks:
    - Include tasks to write or update any ADRs (and the ADR index in docs/adr/README.md).
    - Include tasks to update docs/design/ (architecture, glossary, roadmap) and CHANGELOG.md.
    - Test-first, red -> green (CLAUDE.md Rule 4). Every spec scenario maps to a test. A task that writes the failing test and confirms it fails precedes the task that implements it. Hardware and FFI work starts with a failing check too (build-time assertion, script test, or on-device scenario).
    - Finish with cargo fmt, cargo clippy --all-targets -D warnings, cargo test, cargo deny check, and the ARMv6 check.
    - For changes that affect runtime behavior on the Pi, include a task to record on-device measurements in the change.

operations:
  apply:
    guidance:
      - Keep gameclock-core pure; push I/O, time, and hardware to gameclockd or a driver crate.
      - Red -> green -> refactor. Write the test, run it, and see it fail for the expected reason before writing the code. Then make it pass with the least code, then refactor with tests green.
      - If implementation reveals a decision not covered by an ADR, stop and propose the ADR before continuing.
  archive:
    guidance:
      - Before archiving, confirm docs/design/ and the ADR index match what was built, and update docs/design/roadmap.md.
