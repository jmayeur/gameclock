schema: spec-driven

# Constraints that an agent cannot find in the code. CLAUDE.md has all the
# rules. This file keeps the OpenSpec artifacts in agreement with CLAUDE.md.
# Written in strict STE (ADR-0011).
context: |
  Target device: Raspberry Pi Zero W, one ARMv6 core, 512 MB RAM. hzeller's
  LED driver refreshes the 64x32 panel from its own thread on the same core.
  CPU that the app uses causes visible flicker. Performance is the primary
  goal. A runtime claim needs an on-device measurement (CPU %, refresh Hz,
  RSS), not reasoning.

  Architecture invariants (docs/adr/0005, 0006):
  - gameclock-core is pure. It has no hardware, I/O, threads, or wall clock.
    The daemon injects time and input.
  - The core renders into a Frame (an embedded-graphics DrawTarget). A Panel
    only blits frames.
  - The daemon renders on change and sleeps at all other times. The hot path
    does not allocate heap memory for each frame.
  - unsafe is permitted only in the driver FFI crate.

  The license is GPL-2.0-or-later (docs/adr/0003). Each new dependency must be
  compatible with GPL-2.0 and pass deny.toml. Apache-2.0-only, GPL-3.0, AGPL,
  and LGPL-3.0 crates are not permitted.

  This is not a port. docs/design/legacy-behavior.md describes the old clock.
  It is reference input only. Each proposal decides each behavior again.

  All text follows Simplified Technical English (docs/adr/0011, CLAUDE.md
  Rule 5). Artifacts use STE-flavored mode: sentences of 25 words or fewer,
  active voice, no semicolons, no phrasal verbs, and one name for one thing.

rules:
  proposal:
    - List the ADRs that the change uses.
    - Name each new ADR that the change needs. A change needs an ADR if it changes a dependency or a boundary (crate, trait, process, or protocol). It also needs one if it assumes something about hardware or deployment, touches licensing, or reverses a decision.
    - If the change affects runtime behavior on the Pi, give the expected CPU and memory effect. Say how you will measure it.
    - State what is out of scope.
  specs:
    - Each scenario must be concrete and testable on the host with injected time and input. Mark each exception as an on-device scenario.
    - Write requirements and scenarios in STE. Keep each sentence at 25 words or fewer.
  design:
    - Link ADRs for reasons. Do not repeat the reasons.
    - A design.md does not replace an ADR. Each architectural decision also gets an ADR in docs/adr/.
  tasks:
    - Include tasks to write or update each ADR and the ADR index in docs/adr/README.md.
    - Include tasks to update docs/design/ (architecture, glossary, roadmap) and CHANGELOG.md.
    - Work test-first, red then green (CLAUDE.md Rule 4). Each spec scenario maps to a test. The task that writes a failing test and sees it fail comes before the task that implements it. Hardware and FFI work also starts with a failing check (a build-time assertion, a script test, or an on-device scenario).
    - Finish with cargo fmt, cargo clippy --all-targets -D warnings, cargo test, cargo deny check, the ARMv6 check, and scripts/lint-docs.sh.
    - If the change affects runtime behavior on the Pi, include a task to record on-device measurements in the change.

operations:
  apply:
    guidance:
      - Keep gameclock-core pure. Put I/O, time, and hardware in gameclockd or a driver crate.
      - Work red, then green, then refactor. Write the test. Run it and see it fail for the expected reason. Then write the least code that makes it pass. Then refactor while the tests pass.
      - If the work shows a decision that no ADR covers, stop. Propose the ADR before you continue.
      - Write code comments, error messages, and log lines in strict STE (CLAUDE.md Rule 5).
  archive:
    guidance:
      - Make the archive the last commit on the change's PR, after review and before merge (CLAUDE.md Rule 3).
      - Before the archive, make sure that docs/design/ and the ADR index agree with the code. Update docs/design/roadmap.md.
