name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · armv6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain, components, and targets from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Type-check for Pi Zero W (ARMv6)
        run: cargo check --locked --target arm-unknown-linux-gnueabihf

  openspec:
    name: openspec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Keep in sync with the version in CONTRIBUTING.md / ADR-0008.
      - run: npx -y @fission-ai/openspec@1.17.0 validate --all --strict --no-interactive

  deny:
    name: licenses · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
